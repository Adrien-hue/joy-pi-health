name: Repository quality

on:
  pull_request:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install Go 1.27.1
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: false
      - name: Verify Go version
        run: |
          go version
          test "$(go env GOVERSION)" = go1.27.1
      - name: Verify module
        run: go list -m
      - name: Verify module tidiness
        run: go mod tidy -diff
      - name: Verify formatting
        run: |
          files=$(gofmt -l cmd internal)
          test -z "$files" || { printf '%s\n' "$files"; exit 1; }
          files=$(gofmt -l test)
          test -z "$files" || { printf '%s\n' "$files"; exit 1; }
      - name: Run tests
        run: go test ./...
      - name: Verify Raspberry Pi 3B+ release harness
        if: runner.os == 'Linux'
        run: |
          bash -n test/release/validate-artifacts.sh test/release/pi3bplus/*.sh
          sh test/release/pi3bplus/model-validation-test.sh
          sh test/release/pi3bplus/cpu-methodology-test.sh
      - name: Run vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Verify CLI help
        run: go run ./cmd/joy-pi-health --help
      - name: Verify whitespace and worktree
        run: |
          git diff --check
          git status --short
          test -z "$(git status --short)"

  linux-arm64:
    name: Linux ARM64 compile
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install Go 1.27.1
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: false
      - name: Compile production and affected tests
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
          GOARM64: v8.0
        run: |
          test "$(go env GOVERSION)" = go1.27.1
          go build ./...
          go test -c -o "$RUNNER_TEMP/packaging.test" ./test/packaging
          go test -c -o "$RUNNER_TEMP/ci.test" ./test/ci
